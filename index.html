<!DOCTYPE html>
<html lang="en" class="dark">

                extend: {
                    colors: {
                        darkbg: '#0B0F19',
                        cardbg: '#111827',
                        accent: '#6366F1',
                        accenthover: '#4F46E5'

                }
            }
        }

    <!-- FontAwesome Icons -->

    <!-- Google Fonts -->

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

<body class="bg-darkbg text-gray-100 min-h-screen">

            <p class="text-sm text-gray-300 mb-2">UPI ID: <span class="font-mono text-accent font-bold">9081677292@fam</span></p>

            <div class="mt-4">
                <a href="https://wa.me/919081677292?text=Hello%20Sabir,%20I%20have%20completed%20the%20payment.%20Here%20is%20my%20screenshot." target="_blank" class="block w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-xl transition">
                    <i class="fa-brands fa-whatsapp"></i> Send Payment Screenshot on WhatsApp

    <!-- Footer -->

        <p>&copy; 2026 Instasasta. All rights reserved.</p>
